# mindbridge 前端 nginx 配置
# 职责:1) 托管前端静态文件(SPA);2) 反代 /api/* 到 Go 后端。
# 与 Go 内置的 SPA 托管(mountSPA)是并列方案:容器编排走 nginx,本地 make run 走 Go。

server {
    listen 80;
    server_name _;

    # 前端构建产物挂载到 /usr/share/nginx/html。
    root /usr/share/nginx/html;
    index index.html;

    # /api 反代到 Go 后端服务(compose 中服务名 app:8080)。
    # SSE/流式:关 proxy_buffering、拉长超时,否则 chat/agent 的流式响应会被缓冲卡住。
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式必备:禁缓冲、不截断。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # 拉长超时:agent 多步工具调用可能耗时较长。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA 回退:前端路由(如 /agent、/kb/:id)刷新/深链时返回 index.html,
    # 由前端路由接管。静态资源(.js/.css 等)走默认 try_files 命中真实文件。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
