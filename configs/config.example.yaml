# mindbridge 配置示例
# 复制为 config.yaml 并按需修改;${VAR} 形式会从环境变量读取

server:
  addr: ":8080"
  static_dir: "frontend/dist"   # 前端构建产物;不存在则跳过静态托管(纯后端开发)

postgres:
  dsn: "postgres://mindbridge:mindbridge@localhost:5432/mindbridge?sslmode=disable"

qdrant:
  host: "localhost"
  port: 6333
  # api_key: "${QDRANT_API_KEY}"  # 本地单容器无需

models:
  chat:
    provider: openai            # 仅 openai(OpenAI 兼容)起步
    base_url: "${CHAT_BASE_URL}"
    api_key: "${CHAT_API_KEY}"
    model: "${CHAT_MODEL}"
  embedding:
    provider: openai
    base_url: "${EMB_BASE_URL}"
    api_key: "${EMB_API_KEY}"
    model: "${EMB_MODEL}"
  # cross-encoder 重排服务(通用 /rerank API:Jina / Cohere / SiliconFlow / TEI 兼容)。
  # model 留空则禁用重排,退化为按召回融合序截断。
  reranker:
    base_url: "${RERANK_BASE_URL}"   # 如 https://api.siliconflow.cn/v1
    api_key: "${RERANK_API_KEY}"
    model: ""                        # 如 BAAI/bge-reranker-v2-m3;留空禁用
  # query 改写用小模型(多路改写并行召回);model 留空则禁用改写。
  rewrite:
    provider: openai
    base_url: "${REWRITE_BASE_URL}"
    api_key: "${REWRITE_API_KEY}"
    model: ""                        # 建议便宜快的小模型;留空禁用

ingest:
  chunk_size: 400               # 每个 chunk 的目标 token 数
  chunk_overlap: 80             # 相邻 chunk 重叠 token 数
  separators: ["\n\n", "\n", " "]
  embed_batch: 64               # 单次 embedding 请求文本数(限流保护)
  upsert_batch: 128             # 单次 Qdrant upsert 点数(分批 + 重试)

rag:
  retrieve_top_k: 20            # 每路召回数量(向量 / 关键词各自)
  rerank_top_k: 6               # 重排/截断后保留的文档数
  refuse_threshold: 0.3         # top1 余弦分低于此值则提示模型拒答
  hybrid: true                  # BM25 混合检索(向量+关键词,RRF 融合);旧库自动降级纯向量
  rewrite_n: 2                  # query 改写数量(不含原 query);需配置 models.rewrite

agent:
  max_step: 24                  # ReAct agent 最大步数(模型+工具往返)
  # MCP server 种子:启动时 upsert 进 DB,之后可在前端增删。
  # transport 支持 sse / http;endpoint 为 MCP server 的 SSE/HTTP URL。
  mcp_servers: []
    # - name: "demo"
    #   transport: "sse"
    #   endpoint: "http://localhost:12345/sse"

metrics:
  addr: ":9091"                 # Prometheus /metrics 监听地址(与业务端口分离);置空 "" 关闭

# 线上抽样评测:后台任务抽取问答留痕,用 LLM Judge 评忠实度(faithfulness)写回。
# model 留空则禁用;建议用稳定、便宜的模型,评审结果才可跨期比较。
judge:
  model:
    provider: openai
    base_url: "${JUDGE_BASE_URL}"
    api_key: "${JUDGE_API_KEY}"
    model: ""                   # 留空禁用
  sample_rate: 0.2              # 抽样率(成本控制)
  interval_seconds: 60          # 轮询间隔
  batch: 8                      # 单轮最多处理条数

logging:
  level: "info"                 # debug/info/warn/error
  encoding: "console"           # console(开发可读)或 json(生产机器可读)
  outputs: ["stdout"]           # 输出路径,可加文件路径如 ["/var/log/mindbridge.log"]
  error_outputs: ["stderr"]     # 错误输出路径
